---
layout: reunion
title: "Combined Reading Group Notes"
---

<!-- 1. Search Interface Elements -->
<div style="margin-bottom: 20px;">
  <input 
    type="text" 
    id="vocab-search" 
    placeholder="🔍 Search for words, translations, or dates..." 
    style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;"
  />
</div>

<!-- 2. The HTML Table Structure -->
<table id="master-vocab-table">
  <thead>
    <tr>
      <th>Date</th>
      <th>Word / Phrase</th>
      <th>Translation</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="table-body">
    <tr><td colspan="4">Cargando notas de lectura...</td></tr>
  </tbody>
</table>

<script>
// 3. Liquid Loop auto-generates the Javascript Array at build time

const files = [
{%- assign page_filename = page.path | split: "/" | last -%}
{%- assign folder_len = page.path.size | minus: page_filename.size -%}
{%- assign current_folder = page.path | slice: 0, folder_len -%}

{%- assign all_pages = site.pages | sort: "path" | reverse -%}
{%- for file in all_pages -%}
  {%- assign filename = file.path | split: "/" | last -%}
  {%- assign expected_path = current_folder | append: filename -%}
  {%- if file.path == expected_path and file.path != page.path -%}
    {%- if filename contains "_notas.md" or filename contains "_notes.md" -%}
    {
      url: "{{ file.url | absolute_url }}",
      date: "{{ filename | slice: 0, 8 }}"
    },
    {%- endif -%}
  {%- endif -%}
{%- endfor -%}
];  
files.sort((a, b) => (b.date ?? "").localeCompare(a.date ?? ""));

const tbody = document.getElementById('table-body');
tbody.innerHTML = ''; 

if (files.length === 0) {
  tbody.innerHTML = '<tr><td colspan="4">No se encontraron archivos de notas.</td></tr>';
}

// Keep track of total outstanding fetch processes to initialize live text searching safely
let filesProcessed = 0;

async function getAndParseAllTheThings() {
    for (const fileObj of files) {
        try {
            const { doc, rows } = await loadAndParsePage(fileObj.url);
            if (rows) {
                for (const cells of rows) {
                    if (cells[0].trim()) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
              <td class="cell-date">${fileObj.date}</td>
              <td class="cell-word"><strong>${cells[0]}</strong></td>
              <td class="cell-trans">${cells[1]}</td>
              <td class="cell-notes">${cells[2] || ''}</td>
            `;
                        tbody.appendChild(tr);
                    }
                }
            }
            else {
                console.log("rows is null for file:", fileObj.url, rows);
            }
        } catch(err) {
            console.error("Error:", err);
        }
    }
}

getAndParseAllTheThings().finally(() => {
    initSearchFilter();
});

// 3.5 Grab the page and pull out the first table
async function loadAndParsePage(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`HTTP ${response.status} fetching ${url}`);
  }

  const htmlText = await response.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, "text/html");

  // Query elements just like the live `document`
  const firstTable = doc.querySelector("body table");
  const rows = firstTable ? [...firstTable.querySelectorAll("tbody tr")].map((tr) =>
      [...tr.querySelectorAll("th, td")].map((cell) => cell.textContent.trim())) : null;
  
  // const headings = [...doc.querySelectorAll("h1, h2")].map((el) => el.textContent.trim());
  return { doc, rows };
}              
              
// 4. Client-side Real-time Search Engine
function initSearchFilter() {
  const searchInput = document.getElementById('vocab-search');
  
  searchInput.addEventListener('input', function() {
    const filterText = this.value.toLowerCase().trim();
    const rows = tbody.getElementsByTagName('tr');
    
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      // Get combined text string content from the row cells
      const textContent = row.textContent.toLowerCase();
      
      if (textContent.includes(filterText)) {
        row.style.display = ''; // Show row
      } else {
        row.style.display = 'none'; // Hide row
      }
    }
  });
}
</script>
