---
layout: reunion
title: "Combined Reading Group Notes"
---

<!-- 1. Search Interface Elements -->
<div style="margin-bottom: 20px;">
  <input 
    type="text" 
    id="vocab-search" 
    placeholder="🔍 Search for words, translations, or dates..." 
    style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;"
  />
</div>

<!-- 2. The HTML Table Structure -->
<table id="master-vocab-table">
  <thead>
    <tr>
      <th>Date</th>
      <th>Word / Phrase</th>
      <th>Translation</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="table-body">
    <tr><td colspan="4">Cargando notas de lectura...</td></tr>
  </tbody>
</table>

<script>
// 3. Liquid Loop auto-generates the Javascript Array at build time
  const files = [
  {% assign current_dir = page.dir %}
  {% assign current_dir_name =  current_dir | replace: "/", "" | replace: "%20", " " %}

  {% assign all_pages = site.pages | sort: "path" | reverse %}
  {%- assign notes_dir = current_dir_name -%}
  {%- for file in all_pages -%}
    {%- if file.dir == current_dir and file.extname == ".md" -%}
      {%- assign filename = file.path | split: "/" | last -%}
      
      {%- if filename contains "_notas" or filename contains "_notes" -%}
        {
          url: "{{ file.path | relative_url }}",
          date: "{{ filename | slice: 0, 8 }}"
        },
      {%- endif -%}
    {%- endif -%}
  {%- endfor -%}
];

const tbody = document.getElementById('table-body');
tbody.innerHTML = ''; 

if (files.length === 0) {
  tbody.innerHTML = '<tr><td colspan="4">No se encontraron archivos de notas.</td></tr>';
}

// Keep track of total outstanding fetch processes to initialize live text searching safely
let filesProcessed = 0;

files.forEach(fileObj => {
  fetch(fileObj.url)
    .then(response => {
      if (!response.ok) throw new Error();
      return response.text();
    })
    .then(text => {
      const lines = text.split('\n');
      
      lines.forEach(line => {
        const trimmed = line.trim();
        // Match standard markdown table data row formats (skipping row dividers like |--|--)
        if (trimmed.startsWith('|') && trimmed.endsWith('|') && !trimmed.includes('---')) {
          const cells = trimmed.split('|').map(c => c.trim()).filter(c => c !== '');
          
          // Clean out table headers if they duplicate in text parsing
          const cleanFirstCell = cells[0].toLowerCase();
          if (cleanFirstCell.includes('word') || cleanFirstCell.includes('frase') || cleanFirstCell.includes('palabra')) {
            return;
          }
          
          if (cells.length >= 2) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="cell-date">${fileObj.date}</td>
              <td class="cell-word"><strong>${cells[0]}</strong></td>
              <td class="cell-trans">${cells[1]}</td>
              <td class="cell-notes">${cells[2] || ''}</td>
            `;
            tbody.appendChild(tr);
          }
        }
      });
    })
    .catch(() => console.error(`Error loading: ${fileObj.url}`))
    .finally(() => {
      filesProcessed++;
      // Enable live filtering tracking once data settles
      if (filesProcessed === files.length) {
        initSearchFilter();
      }
    });
});

// 4. Client-side Real-time Search Engine
function initSearchFilter() {
  const searchInput = document.getElementById('vocab-search');
  
  searchInput.addEventListener('input', function() {
    const filterText = this.value.toLowerCase().trim();
    const rows = tbody.getElementsByTagName('tr');
    
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      // Get combined text string content from the row cells
      const textContent = row.textContent.toLowerCase();
      
      if (textContent.includes(filterText)) {
        row.style.display = ''; // Show row
      } else {
        row.style.display = 'none'; // Hide row
      }
    }
  });
}
</script>
